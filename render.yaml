# One instance: room state currently lives in process memory.
services:
  - type: web
    name: twilight-struggle-web
    runtime: node
    plan: free
    branch: main
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run check
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
